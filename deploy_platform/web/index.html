<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>项目更新 · Deploy</title>
<style>
:root{--paper:#faf9f5;--sheet:#fffefa;--ink:#30302e;--muted:#77756e;--rule:#e3e0d8;--sidebar:#f0eee6;--accent:#c47050;--good:#2f7a52;--bad:#b5532f;--serif:"Source Serif 4","Noto Serif SC","Songti SC",serif;--sans:"Noto Sans SC",system-ui,-apple-system,"Microsoft YaHei",sans-serif;--ease:cubic-bezier(.22,1,.36,1)}
@media(prefers-color-scheme:dark){:root{--paper:#262624;--sheet:#30302e;--ink:#eeeae1;--muted:#aba79e;--rule:#484740;--sidebar:#21211f;--accent:#d68c6c;--good:#7cc79c;--bad:#ee9a74}}
*{box-sizing:border-box}html,body{min-height:100%}body{margin:0;padding-left:232px;background:var(--paper);color:var(--ink);font:14px/1.75 var(--sans);-webkit-font-smoothing:antialiased}button,input,select{font:inherit;color:inherit}button{cursor:pointer}.sidebar{position:fixed;inset:0 auto 0 0;width:232px;padding:26px 18px 18px;background:var(--sidebar);border-right:1px solid var(--rule);display:flex;flex-direction:column;z-index:2}.brand{display:flex;align-items:center;gap:9px;color:var(--ink);font:500 21px var(--serif);letter-spacing:-.06em}.brand-mark{width:23px;height:23px;color:var(--accent);font:700 19px var(--serif)}.workspace{font-size:11px;color:var(--muted);margin:4px 0 25px 32px;letter-spacing:.08em}.nav{display:grid;gap:3px}.nav button{display:flex;align-items:center;gap:12px;padding:8px 13px;min-height:40px;border:0;border-radius:8px;background:transparent;text-align:left;color:var(--ink);transition:background 140ms var(--ease),transform 120ms var(--ease)}.nav button:hover,.nav button.active{background:var(--sheet)}.nav button.active{box-shadow:0 1px 3px #00000006}.nav button:active,.btn:active{transform:scale(.98)}.nav-icon{width:17px;color:var(--muted)}.nav button.active .nav-icon{color:var(--accent)}.side-foot{margin-top:auto;padding:14px 12px 0;border-top:1px solid var(--rule);color:var(--muted);font-size:11px}.main{max-width:1080px;margin:auto;padding:48px 48px 64px}.top{display:flex;justify-content:space-between;align-items:start;gap:18px;margin-bottom:28px}.eyebrow{font-size:11px;letter-spacing:.13em;color:var(--muted);font-weight:600;margin:0 0 8px}.top h1{font:500 2.3rem/1.35 var(--serif);letter-spacing:-.04em;margin:0 0 6px}.lead{color:var(--muted);margin:0}.btn{min-height:38px;border-radius:8px;padding:8px 16px;border:1px solid var(--rule);background:transparent;font-size:13px;font-weight:500;transition:background 140ms var(--ease),border-color 140ms var(--ease),transform 120ms var(--ease)}.btn:hover{border-color:var(--muted)}.btn.solid{background:var(--ink);color:var(--paper);border-color:var(--ink)}.btn.accent{background:var(--accent);color:#fff;border-color:var(--accent)}.btn.small{min-height:32px;padding:5px 10px;font-size:12px}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:18px}.summary .cell{padding:13px;border-radius:10px;background:var(--sheet);border:1px solid var(--rule)}.summary .k{font-size:12px;color:var(--muted)}.summary .v{margin-top:2px;font:600 1.35rem/1.2 var(--serif)}.layout{display:grid;grid-template-columns:1fr 1fr;gap:16px}.card{background:var(--sheet);border:1px solid var(--rule);border-radius:14px;padding:22px;margin-bottom:16px;min-width:0}.card.full{grid-column:1/-1}.card-head{display:flex;align-items:baseline;justify-content:space-between;gap:14px;margin-bottom:18px}.card h2{font-size:17px;font-weight:500;letter-spacing:-.02em;margin:0}.caption{font-size:12px;color:var(--muted)}.account{display:flex;align-items:center;gap:10px;padding:8px 0}.avatar{width:27px;height:27px;border-radius:50%;display:grid;place-items:center;background:var(--accent);color:var(--sheet);font-size:12px;font-weight:600}.account .caption{margin-top:-2px}.pill{display:inline-block;padding:0 8px;border:1px solid var(--rule);border-radius:999px;color:var(--muted);font-size:11px;line-height:1.8}.pill.good{color:var(--good);border-color:var(--good)}.project{padding:13px 0;border-top:1px solid var(--rule)}.project:first-child{border-top:0;padding-top:0}.project-line{display:flex;align-items:center;justify-content:space-between;gap:12px}.repo{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.meta{color:var(--muted);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.status{font:12px ui-monospace,Consolas,monospace;color:var(--muted);margin-top:4px}.actions{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 22px}.field{display:grid;gap:5px;margin-bottom:16px}.field.full{grid-column:1/-1}.field label{font-size:12px;color:var(--muted)}.field input,.field select{width:100%;min-height:46px;border:1px solid var(--rule);background:var(--sheet);border-radius:8px;padding:8px 11px;outline:0;transition:border 140ms var(--ease),box-shadow 140ms var(--ease)}.field input:focus,.field select:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 18%,transparent)}.form-foot{grid-column:1/-1;display:flex;align-items:center;gap:12px;border-top:1px solid var(--rule);padding-top:16px}.empty{color:var(--muted);padding:12px 0}.empty strong{display:block;color:var(--ink);font-weight:500}.toast{position:fixed;left:50%;bottom:30px;transform:translate(-50%,10px);opacity:0;background:var(--ink);color:var(--paper);padding:8px 16px;border-radius:8px;font-size:13px;pointer-events:none;transition:opacity 180ms var(--ease),transform 180ms var(--ease);z-index:5}.toast.show{opacity:1;transform:translate(-50%,0)}@media(max-width:900px){body{padding-left:0;padding-top:64px}.sidebar{inset:0 0 auto;width:auto;height:64px;padding:0 20px;display:flex;flex-direction:row;align-items:center}.workspace,.side-foot{display:none}.nav{display:flex;margin-left:auto}.nav button{min-height:36px;padding:6px 10px}.nav button span:last-child{display:none}.brand{font-size:20px}.main{padding:32px 24px 48px}}@media(max-width:650px){.main{padding:26px 18px 42px}.top{display:block}.top .btn{margin-top:16px}.summary{grid-template-columns:1fr 1fr}.summary .cell:last-child{grid-column:1/-1}.layout{display:block}.card{padding:18px}.form{grid-template-columns:1fr}.field.full{grid-column:auto}.form-foot{grid-column:auto;align-items:flex-start;flex-direction:column}.project-line{display:block}.actions{justify-content:flex-start;margin-top:9px}}
</style>
<body><aside class="sidebar"><div class="brand"><span class="brand-mark">◒</span><span>Deploy</span></div><div class="workspace">项目更新工作台</div><nav class="nav"><button class="active"><span class="nav-icon">⌂</span><span>概览</span></button><button onclick="document.querySelector('#create').scrollIntoView({behavior:'smooth'})"><span class="nav-icon">＋</span><span>新建项目</span></button><button onclick="load()"><span class="nav-icon">↻</span><span>刷新状态</span></button></nav><div class="side-foot">GitHub 项目部署<br>版本可追踪，可回滚</div></aside>
<main class="main"><header class="top"><div><p class="eyebrow">SELF-HOSTED DEPLOYMENT</p><h1>项目概览</h1><p class="lead">从 GitHub 到服务器，管理每一次部署和更新。</p></div><button class="btn solid" onclick="location.href='/auth/github/start'">绑定 GitHub</button></header>
<div class="summary"><div class="cell"><div class="k">部署项目</div><div class="v" id="projectCount">—</div></div><div class="cell"><div class="k">GitHub 账号</div><div class="v" id="accountCount">—</div></div><div class="cell"><div class="k">系统状态</div><div class="v" id="latestState">—</div></div></div>
<div class="layout"><section class="card"><div class="card-head"><h2>GitHub 账号</h2><span class="caption" id="accountHint"></span></div><div id="accounts"><span class="caption">正在读取…</span></div></section><section class="card"><div class="card-head"><h2>部署项目</h2><span class="caption" id="projectHint"></span></div><div id="projects"><span class="caption">正在读取…</span></div></section><section class="card full" id="create"><div class="card-head"><div><h2>创建部署项目</h2><div class="caption">为仓库创建独立版本目录，并接入 GitHub Push 更新。</div></div></div><form class="form"><div class="field"><label>GitHub 账号</label><select id="account" required><option value="">先绑定账号</option></select></div><div class="field"><label>仓库</label><select id="repo" required><option value="">先选择账号</option></select></div><div class="field"><label>分支</label><input id="branch" value="main" required></div><div class="field"><label>服务器部署目录</label><input id="root" placeholder="/opt/my-app" required></div><div class="field"><label>构建命令</label><input id="build" placeholder="npm ci && npm run build（可留空）"></div><div class="field"><label>启动命令</label><input id="start" placeholder="systemctl restart my-app" required></div><div class="form-foot"><button class="btn accent">创建项目</button><span class="caption" id="created">创建后会显示 Webhook Secret，请保存。</span></div></form></section></div></main><div class="toast" id="toast"></div>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let projects=[];
async function api(path,opt){const r=await fetch(path,opt);const d=await r.json();if(!r.ok)throw Error(d.detail||d.error||'请求失败');return d}
function toast(msg){const el=$('#toast');el.textContent=msg;el.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.remove('show'),3200)}
async function load(){try{const [accounts,data]=await Promise.all([api('/api/accounts'),api('/api/projects')]);projects=data;$('#accountCount').textContent=accounts.length;$('#projectCount').textContent=projects.length;$('#latestState').textContent='正常';$('#accountHint').textContent=accounts.length?'已连接':'尚未连接';$('#projectHint').textContent=projects.length?`${projects.length} 个项目`:'还没有项目';$('#accounts').innerHTML=accounts.length?accounts.map(a=>`<div class="account"><span class="avatar">${esc(a.login[0]||'G').toUpperCase()}</span><div><b>${esc(a.login)}</b><div class="caption">GitHub · 已授权仓库读取</div></div><span class="pill good" style="margin-left:auto">已连接</span></div>`).join(''):'<div class="empty"><strong>还没有 GitHub 账号</strong>点击右上角绑定一个账号。</div>';$('#account').innerHTML='<option value="">选择账号</option>'+accounts.map(a=>`<option value="${a.id}">${esc(a.login)}</option>`).join('');renderProjects()}catch(e){$('#latestState').textContent='异常';toast(e.message)}}
function renderProjects(){$('#projects').innerHTML=projects.length?projects.map(p=>`<div class="project"><div class="project-line"><div class="repo">${esc(p.repository)} <span class="pill">${esc(p.branch)}</span></div><div class="actions"><button class="btn small" onclick="check(${p.id})">检查</button><button class="btn accent small" onclick="run(${p.id},'update')">更新</button><button class="btn small" onclick="run(${p.id},'rollback')">回滚</button></div></div><div class="meta">${esc(p.github_login)} · ${esc(p.deploy_root)}</div><div class="status" id="s${p.id}">尚未检查版本</div></div>`).join(''):'<div class="empty"><strong>还没有部署项目</strong>在下方选择仓库创建项目。</div>'}
$('#account').onchange=async()=>{const id=$('#account').value;if(!id)return;try{const repos=await api(`/api/accounts/${id}/repositories`);$('#repo').innerHTML='<option value="">选择仓库</option>'+repos.map(r=>`<option value="${esc(r.full_name)}" data-branch="${esc(r.default_branch)}">${esc(r.full_name)}${r.private?' · 私有':''}</option>`).join('')}catch(e){toast(e.message)}};$('#repo').onchange=()=>{const o=$('#repo').selectedOptions[0];if(o?.dataset.branch)$('#branch').value=o.dataset.branch};
async function check(id){try{const d=await api(`/api/projects/${id}/check`);$(`#s${id}`).textContent=d.available?`发现新版本 · ${d.sha.slice(0,8)}`:`已是最新版 · ${d.sha.slice(0,8)}`}catch(e){toast(e.message)}}async function run(id,action){try{const d=await api(`/api/projects/${id}/${action}`,{method:'POST'});$(`#s${id}`).textContent=`${action==='rollback'?'回滚':'更新'}任务已提交 · #${d.deployment_id}`;toast('操作已提交，正在准备版本');setTimeout(load,1500)}catch(e){toast(e.message)}}
document.querySelector('form').onsubmit=async e=>{e.preventDefault();try{const d=await api('/api/projects',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({account_id:Number($('#account').value),repository:$('#repo').value,branch:$('#branch').value,deploy_root:$('#root').value,start_command:$('#start').value,build_command:$('#build').value})});$('#created').textContent=`项目 #${d.id} 已创建。Webhook Secret：${d.webhook_secret}`;toast('项目创建成功');load()}catch(e){toast(e.message)}};load();
</script></body></html>
