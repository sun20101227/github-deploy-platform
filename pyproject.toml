[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "github-deploy-platform"
version = "0.1.0"
description = "Self-hosted GitHub project deployment and update platform"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "httpx>=0.27",
  "pydantic>=2.8",
  "GitPython>=3.1.45,<4",
  "docker>=7.1,<8",
  "python-on-whales>=0.78,<1",
]

[tool.setuptools.packages.find]
include = ["deploy_platform*"]

[tool.setuptools.package-data]
deploy_platform = ["web/*"]

